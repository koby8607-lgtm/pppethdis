name: Build USB0 Manager v1.9.0 PPP

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      NDK_VERSION: "25.2.9519653"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Prepare Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Locate or install NDK without sdkmanager
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          WANTED="${NDK_VERSION}"

          echo "Android SDK: ${SDK}"
          echo "Requested NDK: ${WANTED}"

          if [ -d "${SDK}/ndk/${WANTED}" ]; then
            echo "Using preinstalled NDK ${WANTED}"
            NDK_DIR="${SDK}/ndk/${WANTED}"
          else
            echo "NDK ${WANTED} not preinstalled."
            echo "Installing it manually instead of using sdkmanager."

            WORK="${RUNNER_TEMP}/ndk-download"
            ZIP="${WORK}/android-ndk-r25c-linux.zip"
            EXTRACT="${WORK}/extract"

            rm -rf "${WORK}"
            mkdir -p "${WORK}" "${EXTRACT}"

            URL="https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"

            success=0

            for attempt in 1 2 3 4 5; do
              echo
              echo "NDK download attempt ${attempt}/5"

              rm -f "${ZIP}"

              curl \
                --fail \
                --show-error \
                --location \
                --retry 5 \
                --retry-all-errors \
                --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 1800 \
                "${URL}" \
                -o "${ZIP}" || true

              if [ ! -s "${ZIP}" ]; then
                echo "Download failed."
                continue
              fi

              echo "Testing ZIP integrity..."

              if unzip -t "${ZIP}" >/dev/null 2>&1; then
                echo "ZIP integrity OK."
                success=1
                break
              fi

              echo "Downloaded ZIP is corrupt. Removing it and retrying."
              rm -f "${ZIP}"
            done

            if [ "${success}" -ne 1 ]; then
              echo "ERROR: Could not obtain a valid NDK ZIP."
              exit 1
            fi

            echo "Extracting NDK..."

            unzip -q "${ZIP}" -d "${EXTRACT}"

            FOUND="$(find "${EXTRACT}" -maxdepth 2 -type f -name source.properties | head -n 1 || true)"

            if [ -z "${FOUND}" ]; then
              echo "ERROR: NDK source.properties not found after extraction."
              find "${EXTRACT}" -maxdepth 3 -type f | head -n 100
              exit 1
            fi

            NDK_TOP="$(dirname "${FOUND}")"

            if [ ! -d "${NDK_TOP}" ]; then
              echo "ERROR: Could not determine NDK directory."
              exit 1
            fi

            rm -rf "${SDK}/ndk/${WANTED}"
            mkdir -p "${SDK}/ndk"
            mv "${NDK_TOP}" "${SDK}/ndk/${WANTED}"

            NDK_DIR="${SDK}/ndk/${WANTED}"
          fi

          test -d "${NDK_DIR}"

          TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "${TOOLCHAIN}/aarch64-linux-android30-clang"
          test -x "${TOOLCHAIN}/llvm-strip"
          test -x "${TOOLCHAIN}/llvm-readelf"

          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "${NDK_DIR}" >> "$GITHUB_PATH"
          echo "${TOOLCHAIN}" >> "$GITHUB_PATH"

          echo
          echo "Using NDK:"
          echo "${NDK_DIR}"

          echo
          echo "NDK version:"
          cat "${NDK_DIR}/source.properties"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew
          ./gradlew --version

      - name: Remove old external Gradle patch
        shell: bash
        run: |
          set -euo pipefail

          rm -f android-build-fix.gradle
          rm -f app/android-build-fix.gradle

      - name: Force Kotlin and Java JVM 17
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("app/build.gradle not found")

          s = p.read_text()

          s = s.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          p.write_text(s)

          print("JVM target normalized to 17.")
          PY

      - name: Fix known Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          for p in Path("app/src/main/java").rglob("*.kt"):
              s = p.read_text()

              s = s.replace(
                  "singleLine = true",
                  "isSingleLine = true"
              )

              p.write_text(s)
          PY

      - name: Build ARM64 usb0-native
        shell: bash
        run: |
          set -euo pipefail

          SRC="app/src/main/cpp/usb0-native.c"
          OUT="app/src/main/assets/tools/arm64-v8a/usb0-native"

          test -f "${SRC}"

          mkdir -p "$(dirname "${OUT}")"

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "${TOOLCHAIN}/aarch64-linux-android30-clang" \
            -O2 \
            -fPIE \
            -fstack-protector-strong \
            -DANDROID \
            -D__ANDROID_API__=30 \
            -D_GNU_SOURCE=1 \
            -pie \
            "${SRC}" \
            -o "${OUT}"

          "${TOOLCHAIN}/llvm-strip" "${OUT}"

          chmod 755 "${OUT}"

          file "${OUT}" |
            grep -Eiq 'ELF 64-bit.*ARM aarch64'

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" |
            grep -E 'Class:|Machine:|Type:'

      - name: Verify supplied ARM64 BusyBox
        shell: bash
        run: |
          set -euo pipefail

          BUSYBOX="app/src/main/assets/tools/arm64-v8a/busybox"

          test -f "${BUSYBOX}"
          test -s "${BUSYBOX}"

          chmod 755 "${BUSYBOX}"

          file "${BUSYBOX}"

          file "${BUSYBOX}" |
            grep -Eiq 'ELF 64-bit.*ARM aarch64'

          echo "BusyBox:"
          sha256sum "${BUSYBOX}"

      - name: Install PPP build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            curl \
            ca-certificates \
            unzip \
            gzip \
            tar \
            bison \
            flex

      - name: Build Android ARM64 PPPD and chat
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tools/arm64-v8a

          if [ -f scripts/build-ppp.sh ]; then
            chmod 755 scripts/build-ppp.sh
          fi

          cat > scripts/build-ppp.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          VERSION="2.5.4"
          WORK="${RUNNER_TEMP}/usb0-ppp-${VERSION}"
          ARCHIVE="${WORK}/ppp-${VERSION}.tar.gz"
          SRC="${WORK}/ppp"

          OUT="$(pwd)/app/src/main/assets/tools/arm64-v8a"

          NDK="${ANDROID_NDK_ROOT}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          CXX="${TOOLCHAIN}/aarch64-linux-android30-clang++"
          AR="${TOOLCHAIN}/llvm-ar"
          RANLIB="${TOOLCHAIN}/llvm-ranlib"
          STRIP="${TOOLCHAIN}/llvm-strip"
          READELF="${TOOLCHAIN}/llvm-readelf"

          rm -rf "${WORK}"
          mkdir -p "${WORK}" "${OUT}"

          # Create global compatibility headers for Android Bionic
          mkdir -p "${WORK}/myinc"
          touch "${WORK}/myinc/utmp.h"
          touch "${WORK}/myinc/utmpx.h"
          touch "${WORK}/myinc/crypt.h"
          touch "${WORK}/myinc/features.h"
          touch "${WORK}/myinc/wordexp.h"

          cat > "${WORK}/myinc/android_compat.h" <<'EOF'
          #ifndef _ANDROID_COMPAT_H
          #define _ANDROID_COMPAT_H
          #include <string.h>
          #ifndef bcopy
          #define bcopy(s,d,n) memmove(d,s,n)
          #endif
          #ifndef bzero
          #define bzero(s,n) memset(s,0,n)
          #endif
          #ifndef bcmp
          #define bcmp(s1,s2,n) memcmp(s1,s2,n)
          #endif
          #endif
          EOF

          # -w suppresses all warnings preventing them from being escalated to errors
          export CFLAGS="-O2 -fPIE -fstack-protector-strong -DANDROID -D__ANDROID_API__=30 -D_GNU_SOURCE=1 -w -I${WORK}/myinc -include ${WORK}/myinc/android_compat.h"
          export CPPFLAGS="${CFLAGS}"
          export LDFLAGS="-pie"

          URL="https://github.com/ppp-project/ppp/archive/refs/tags/v${VERSION}.tar.gz"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            "${URL}" \
            -o "${ARCHIVE}"

          test -s "${ARCHIVE}"

          tar -tzf "${ARCHIVE}" >/dev/null

          tar -xzf "${ARCHIVE}" -C "${WORK}"

          FOUND_DIR="$(find "${WORK}" -mindepth 1 -maxdepth 1 -type d -name 'ppp-*' | head -n 1)"

          if [ -z "${FOUND_DIR}" ]; then
            echo "PPP source directory not found."
            exit 1
          fi

          mv "${FOUND_DIR}" "${SRC}"
          cd "${SRC}"

          if [ ! -x ./configure ]; then
            ./autogen.sh
          fi

          rm -f config.cache

          # Pass CC, CFLAGS natively into configure
          ac_cv_func_logwtmp=no \
          ac_cv_lib_util_logwtmp=no \
          ac_cv_header_utmp_h=no \
          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host=aarch64-linux-android \
            --prefix=/data/local/tmp/usb0-ppp \
            --sysconfdir=/data/local/tmp/usb0-ppp/etc \
            --disable-plugins \
            --disable-eaptls \
            --disable-peap \
            --disable-systemd \
            --without-openssl \
            --without-pam \
            --without-pcap \
            --without-atm \
            CC="${CC}" \
            CXX="${CXX}" \
            AR="${AR}" \
            RANLIB="${RANLIB}" \
            CFLAGS="${CFLAGS}" \
            CPPFLAGS="${CPPFLAGS}" \
            LDFLAGS="${LDFLAGS}"

          echo
          echo "Building PPPD..."
          make -C pppd -j"$(nproc)" V=1

          echo
          echo "Building chat..."
          make -C chat -j"$(nproc)" V=1

          test -s pppd/pppd
          test -s chat/chat

          cp pppd/pppd "${OUT}/pppd"
          cp chat/chat "${OUT}/chat"

          chmod 755 "${OUT}/pppd" "${OUT}/chat"

          "${STRIP}" "${OUT}/pppd"
          "${STRIP}" "${OUT}/chat"

          file "${OUT}/pppd"
          file "${OUT}/chat"

          file "${OUT}/pppd" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          file "${OUT}/chat" | grep -Eiq 'ELF 64-bit.*ARM aarch64'

          echo
          echo "PPPD and chat built successfully."
          SCRIPT

          chmod 755 scripts/build-ppp.sh
          bash -n scripts/build-ppp.sh
          ./scripts/build-ppp.sh

      - name: Verify PPP binaries
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            app/src/main/assets/tools/arm64-v8a/pppd \
            app/src/main/assets/tools/arm64-v8a/chat
          do
            test -f "${f}"
            test -s "${f}"

            file "${f}" |
              grep -Eiq 'ELF 64-bit.*ARM aarch64'

            sha256sum "${f}"
          done

      - name: Verify shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' f; do
            echo "Checking ${f}"
            bash -n "${f}"
          done < <(
            find scripts app/src/main/assets \
              -type f \
              -name "*.sh" \
              -print0
          )

      - name: Verify project assets
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            app/src/main/assets/tools/arm64-v8a/busybox \
            app/src/main/assets/tools/arm64-v8a/usb0-native \
            app/src/main/assets/tools/arm64-v8a/usb0-helper \
            app/src/main/assets/tools/arm64-v8a/usb0-helper.sh \
            app/src/main/assets/tools/arm64-v8a/pppd \
            app/src/main/assets/tools/arm64-v8a/chat
          do
            test -s "${f}"
            echo "OK: ${f}"
          done

      - name: Check Gradle
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew tasks \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain

      - name: Compile Kotlin
        shell: bash
        run: |
          set -uo pipefail

          LOG="${RUNNER_TEMP}/kotlin.log"

          ./gradlew :app:compileDebugKotlin \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "${LOG}"

          RC=${PIPESTATUS[0]}

          echo
          echo "===== KOTLIN ERRORS ====="

          grep -E \
            '(^e: |error:|\.kt:[0-9]+:[0-9]+)' \
            "${LOG}" || true

          echo "===== END KOTLIN ERRORS ====="

          exit "${RC}"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain

      - name: Create CI signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "${RUNNER_TEMP}/usb0-manager-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias usb0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=USB0 Manager, OU=R36S, O=USB0 Manager, L=R36S, ST=R36S, C=GB" \
            -noprompt

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            -PRELEASE_STORE_FILE="${RUNNER_TEMP}/usb0-manager-release.jks" \
            -PRELEASE_STORE_PASSWORD=changeit \
            -PRELEASE_KEY_ALIAS=usb0 \
            -PRELEASE_KEY_PASSWORD=changeit

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          found=0

          for apk in \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
          do
            [ -f "${apk}" ] || continue

            found=1

            echo "Verifying ${apk}"

            "${APKSIGNER}" verify --verbose "${apk}"

            for asset in \
              busybox \
              usb0-native \
              usb0-helper \
              usb0-helper.sh \
              pppd \
              chat
            do
              unzip -l "${apk}" |
                grep -F "assets/tools/arm64-v8a/${asset}"
            done
          done

          test "${found}" -eq 1

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp app/build/outputs/apk/debug/*.apk artifacts/
          cp app/build/outputs/apk/release/*.apk artifacts/

          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.9.0
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.9.0-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/**
            ${{ runner.temp }}/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
